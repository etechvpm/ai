<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 478" width="990" height="478" role="img" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto"><title>match / structural pattern matching</title><style>text { font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif; }svg { color-scheme: light dark; }</style>
<text x="495" y="28" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="var(--dg-ink, #0f172a)">match: structural pattern matching (3.10+)</text>
<text x="495" y="46" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" font-style="italic" fill="var(--dg-muted, #64748b)">Not a switch statement - it DESTRUCTURES values against patterns.</text>
<rect x="31.0" y="70" width="300" height="92" rx="10" fill="var(--dg-bg, #ffffff)" stroke="var(--dg-blue, #2563eb)" stroke-width="1.6"/>
<rect x="31.0" y="70" width="5" height="92" rx="2" fill="var(--dg-blue, #2563eb)"/>
<text x="49.0" y="92" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="var(--dg-blue, #2563eb)">Literal</text>
<text x="49.0" y="118" text-anchor="start" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'SF Mono', Menlo, monospace" font-size="12.5" font-weight="600" font-style="normal" fill="var(--dg-ink, #0f172a)">case 404:</text>
<text x="49.0" y="142" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" font-style="normal" fill="var(--dg-muted, #64748b)">matches an exact value</text>
<rect x="345.0" y="70" width="300" height="92" rx="10" fill="var(--dg-bg, #ffffff)" stroke="var(--dg-blue, #2563eb)" stroke-width="1.6"/>
<rect x="345.0" y="70" width="5" height="92" rx="2" fill="var(--dg-blue, #2563eb)"/>
<text x="363.0" y="92" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="var(--dg-blue, #2563eb)">Capture</text>
<text x="363.0" y="118" text-anchor="start" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'SF Mono', Menlo, monospace" font-size="12.5" font-weight="600" font-style="normal" fill="var(--dg-ink, #0f172a)">case name:</text>
<text x="363.0" y="142" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" font-style="normal" fill="var(--dg-muted, #64748b)">binds anything to a name</text>
<rect x="659.0" y="70" width="300" height="92" rx="10" fill="var(--dg-bg, #ffffff)" stroke="var(--dg-slate, #475569)" stroke-width="1.6"/>
<rect x="659.0" y="70" width="5" height="92" rx="2" fill="var(--dg-slate, #475569)"/>
<text x="677.0" y="92" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="var(--dg-slate, #475569)">Wildcard</text>
<text x="677.0" y="118" text-anchor="start" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'SF Mono', Menlo, monospace" font-size="12.5" font-weight="600" font-style="normal" fill="var(--dg-ink, #0f172a)">case _:</text>
<text x="677.0" y="142" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" font-style="normal" fill="var(--dg-muted, #64748b)">matches everything, binds nothing</text>
<rect x="31.0" y="176" width="300" height="92" rx="10" fill="var(--dg-bg, #ffffff)" stroke="var(--dg-green, #059669)" stroke-width="1.6"/>
<rect x="31.0" y="176" width="5" height="92" rx="2" fill="var(--dg-green, #059669)"/>
<text x="49.0" y="198" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="var(--dg-green, #059669)">Sequence</text>
<text x="49.0" y="224" text-anchor="start" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'SF Mono', Menlo, monospace" font-size="12.5" font-weight="600" font-style="normal" fill="var(--dg-ink, #0f172a)">case [x, y]:</text>
<text x="49.0" y="248" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" font-style="normal" fill="var(--dg-muted, #64748b)">list/tuple of that shape</text>
<rect x="345.0" y="176" width="300" height="92" rx="10" fill="var(--dg-bg, #ffffff)" stroke="var(--dg-green, #059669)" stroke-width="1.6"/>
<rect x="345.0" y="176" width="5" height="92" rx="2" fill="var(--dg-green, #059669)"/>
<text x="363.0" y="198" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="var(--dg-green, #059669)">Sequence *</text>
<text x="363.0" y="224" text-anchor="start" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'SF Mono', Menlo, monospace" font-size="12.5" font-weight="600" font-style="normal" fill="var(--dg-ink, #0f172a)">case [first, *rest]:</text>
<text x="363.0" y="248" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" font-style="normal" fill="var(--dg-muted, #64748b)">captures the tail</text>
<rect x="659.0" y="176" width="300" height="92" rx="10" fill="var(--dg-bg, #ffffff)" stroke="var(--dg-amber, #d97706)" stroke-width="1.6"/>
<rect x="659.0" y="176" width="5" height="92" rx="2" fill="var(--dg-amber, #d97706)"/>
<text x="677.0" y="198" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="var(--dg-amber, #d97706)">Mapping</text>
<text x="677.0" y="224" text-anchor="start" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'SF Mono', Menlo, monospace" font-size="12.5" font-weight="600" font-style="normal" fill="var(--dg-ink, #0f172a)">case {&#x27;id&#x27;: i}:</text>
<text x="677.0" y="248" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" font-style="normal" fill="var(--dg-muted, #64748b)">dict having that key</text>
<rect x="31.0" y="282" width="300" height="92" rx="10" fill="var(--dg-bg, #ffffff)" stroke="var(--dg-violet, #7c3aed)" stroke-width="1.6"/>
<rect x="31.0" y="282" width="5" height="92" rx="2" fill="var(--dg-violet, #7c3aed)"/>
<text x="49.0" y="304" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="var(--dg-violet, #7c3aed)">Class</text>
<text x="49.0" y="330" text-anchor="start" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'SF Mono', Menlo, monospace" font-size="12.5" font-weight="600" font-style="normal" fill="var(--dg-ink, #0f172a)">case Point(x=0, y=y):</text>
<text x="49.0" y="354" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" font-style="normal" fill="var(--dg-muted, #64748b)">instance + attribute test</text>
<rect x="345.0" y="282" width="300" height="92" rx="10" fill="var(--dg-bg, #ffffff)" stroke="var(--dg-cyan, #0891b2)" stroke-width="1.6"/>
<rect x="345.0" y="282" width="5" height="92" rx="2" fill="var(--dg-cyan, #0891b2)"/>
<text x="363.0" y="304" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="var(--dg-cyan, #0891b2)">OR</text>
<text x="363.0" y="330" text-anchor="start" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'SF Mono', Menlo, monospace" font-size="12.5" font-weight="600" font-style="normal" fill="var(--dg-ink, #0f172a)">case &#x27;a&#x27; | &#x27;b&#x27;:</text>
<text x="363.0" y="354" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" font-style="normal" fill="var(--dg-muted, #64748b)">either pattern</text>
<rect x="659.0" y="282" width="300" height="92" rx="10" fill="var(--dg-bg, #ffffff)" stroke="var(--dg-red, #dc2626)" stroke-width="1.6"/>
<rect x="659.0" y="282" width="5" height="92" rx="2" fill="var(--dg-red, #dc2626)"/>
<text x="677.0" y="304" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="var(--dg-red, #dc2626)">Guard</text>
<text x="677.0" y="330" text-anchor="start" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'SF Mono', Menlo, monospace" font-size="12.5" font-weight="600" font-style="normal" fill="var(--dg-ink, #0f172a)">case n if n &gt; 0:</text>
<text x="677.0" y="354" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" font-style="normal" fill="var(--dg-muted, #64748b)">pattern + boolean condition</text>
<rect x="31.0" y="394" width="928" height="62" rx="10" fill="var(--dg-amberbg, #fef3c7)" stroke="var(--dg-amber, #d97706)" stroke-width="1.6"/>
<text x="47.0" y="418" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">Careful: `case Point(x=0)` matches only keyword-style fields declared in __match_args__.</text>
<text x="47.0" y="436" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">A bare `case x:` shadows everything below it - always put the wildcard/capture case LAST.</text>
</svg>
