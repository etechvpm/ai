<text x="530" y="328" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="var(--dg-amber, #d97706)">Non-negotiables</text>
<text x="530" y="352" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.3" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">* a published version is immutable - never re-upload, use .post1</text>
<text x="530" y="368" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.3" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">* yank broken releases, do not delete them</text>
<text x="530" y="384" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.3" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">* the release job needs: the test jobs, and least-privilege</text>
<text x="530" y="400" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.3" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">  permissions (id-token: write) - nothing else</text>
<text x="530" y="416" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.3" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">* deprecate for one minor release before removing anything</text>
