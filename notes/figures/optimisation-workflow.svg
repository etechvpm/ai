<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 448" width="990" height="448" role="img" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto"><title>A professional optimisation workflow</title><style>text { font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif; }svg { color-scheme: light dark; }</style>
  <defs>
    <marker id="arline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dg-line, #cbd5e1)"/></marker>
  </defs>
<text x="495" y="28" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="var(--dg-ink, #0f172a)">Make it work → make it right → make it fast</text>
<rect x="21.0" y="66" width="148" height="116" rx="10" fill="var(--dg-bg, #ffffff)" stroke="var(--dg-blue, #2563eb)" stroke-width="1.6"/>
<rect x="21.0" y="66" width="148" height="30" rx="10" fill="var(--dg-blue, #2563eb)"/>
<rect x="21.0" y="86" width="148" height="10" rx="0" fill="var(--dg-blue, #2563eb)"/>
<text x="95.0" y="86" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" font-style="normal" fill="var(--dg-bg, #ffffff)">1. measure first</text>
<text x="95.0" y="124" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" font-style="normal" fill="var(--dg-slate, #475569)">time.perf_counter, cProfile,</text>
<text x="95.0" y="139" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" font-style="normal" fill="var(--dg-slate, #475569)">py-spy, tracemalloc</text>
<rect x="181.0" y="66" width="148" height="116" rx="10" fill="var(--dg-bg, #ffffff)" stroke="var(--dg-violet, #7c3aed)" stroke-width="1.6"/>
<rect x="181.0" y="66" width="148" height="30" rx="10" fill="var(--dg-violet, #7c3aed)"/>
<rect x="181.0" y="86" width="148" height="10" rx="0" fill="var(--dg-violet, #7c3aed)"/>
<text x="255.0" y="86" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" font-style="normal" fill="var(--dg-bg, #ffffff)">2. find the hotspot</text>
<text x="255.0" y="124" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" font-style="normal" fill="var(--dg-slate, #475569)">usually ONE function holds</text>
<text x="255.0" y="139" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" font-style="normal" fill="var(--dg-slate, #475569)">80% of the time</text>
<line x1="169.0" y1="124.0" x2="181.0" y2="124.0" stroke="var(--dg-line, #cbd5e1)" stroke-width="1.6" marker-end="url(#arline)"/>
<rect x="341.0" y="66" width="148" height="116" rx="10" fill="var(--dg-bg, #ffffff)" stroke="var(--dg-green, #059669)" stroke-width="1.6"/>
<rect x="341.0" y="66" width="148" height="30" rx="10" fill="var(--dg-green, #059669)"/>
<rect x="341.0" y="86" width="148" height="10" rx="0" fill="var(--dg-green, #059669)"/>
<text x="415.0" y="86" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" font-style="normal" fill="var(--dg-bg, #ffffff)">3. fix the algorithm</text>
<text x="415.0" y="124" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" font-style="normal" fill="var(--dg-slate, #475569)">O(n²) -&gt; O(n) with a set</text>
<text x="415.0" y="139" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" font-style="normal" fill="var(--dg-slate, #475569)">or dict beats any micro-tuning</text>
<line x1="329.0" y1="124.0" x2="341.0" y2="124.0" stroke="var(--dg-line, #cbd5e1)" stroke-width="1.6" marker-end="url(#arline)"/>
<rect x="501.0" y="66" width="148" height="116" rx="10" fill="var(--dg-bg, #ffffff)" stroke="var(--dg-amber, #d97706)" stroke-width="1.6"/>
<rect x="501.0" y="66" width="148" height="30" rx="10" fill="var(--dg-amber, #d97706)"/>
<rect x="501.0" y="86" width="148" height="10" rx="0" fill="var(--dg-amber, #d97706)"/>
<text x="575.0" y="86" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" font-style="normal" fill="var(--dg-bg, #ffffff)">4. change the data</text>
<text x="575.0" y="124" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" font-style="normal" fill="var(--dg-slate, #475569)">right container, right layout,</text>
<text x="575.0" y="139" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" font-style="normal" fill="var(--dg-slate, #475569)">generators instead of lists</text>
<line x1="489.0" y1="124.0" x2="501.0" y2="124.0" stroke="var(--dg-line, #cbd5e1)" stroke-width="1.6" marker-end="url(#arline)"/>
<rect x="661.0" y="66" width="148" height="116" rx="10" fill="var(--dg-bg, #ffffff)" stroke="var(--dg-cyan, #0891b2)" stroke-width="1.6"/>
<rect x="661.0" y="66" width="148" height="30" rx="10" fill="var(--dg-cyan, #0891b2)"/>
<rect x="661.0" y="86" width="148" height="10" rx="0" fill="var(--dg-cyan, #0891b2)"/>
<text x="735.0" y="86" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" font-style="normal" fill="var(--dg-bg, #ffffff)">5. micro-optimise</text>
<text x="735.0" y="124" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" font-style="normal" fill="var(--dg-slate, #475569)">local vars, avoid attribute</text>
<text x="735.0" y="139" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" font-style="normal" fill="var(--dg-slate, #475569)">lookups in hot loops</text>
<line x1="649.0" y1="124.0" x2="661.0" y2="124.0" stroke="var(--dg-line, #cbd5e1)" stroke-width="1.6" marker-end="url(#arline)"/>
<rect x="821.0" y="66" width="148" height="116" rx="10" fill="var(--dg-bg, #ffffff)" stroke="var(--dg-red, #dc2626)" stroke-width="1.6"/>
<rect x="821.0" y="66" width="148" height="30" rx="10" fill="var(--dg-red, #dc2626)"/>
<rect x="821.0" y="86" width="148" height="10" rx="0" fill="var(--dg-red, #dc2626)"/>
<text x="895.0" y="86" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" font-style="normal" fill="var(--dg-bg, #ffffff)">6. parallelise / C</text>
<text x="895.0" y="124" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" font-style="normal" fill="var(--dg-slate, #475569)">numpy, Cython, Rust ext,</text>
<text x="895.0" y="139" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" font-style="normal" fill="var(--dg-slate, #475569)">multiprocessing, cache</text>
<line x1="809.0" y1="124.0" x2="821.0" y2="124.0" stroke="var(--dg-line, #cbd5e1)" stroke-width="1.6" marker-end="url(#arline)"/>
<line x1="21.0" y1="206" x2="969.0" y2="206" stroke="var(--dg-line, #cbd5e1)" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="495" y="200" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" font-style="italic" fill="var(--dg-muted, #64748b)">each step must be re-measured - and the benchmark must live in the test suite</text>
<rect x="21.0" y="226" width="900" height="28" rx="6" fill="var(--dg-slate, #475569)"/>
<rect x="21.0" y="248" width="900" height="6" rx="0" fill="var(--dg-slate, #475569)"/>
<text x="31.0" y="244.0" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" font-style="normal" fill="var(--dg-bg, #ffffff)">change</text>
<text x="411.0" y="244.0" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" font-style="normal" fill="var(--dg-bg, #ffffff)">typical gain</text>
<text x="611.0" y="244.0" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" font-style="normal" fill="var(--dg-bg, #ffffff)">why it works</text>
<rect x="21.0" y="254" width="900" height="25" rx="0" fill="var(--dg-panel, #f8fafc)"/>
<text x="31.0" y="270.5" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">swap `x in list` for `x in set`</text>
<text x="411.0" y="270.5" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" font-style="normal" fill="var(--dg-green, #059669)">10x - 1000x</text>
<text x="611.0" y="270.5" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">algorithm / data structure</text>
<rect x="21.0" y="279" width="900" height="25" rx="0" fill="var(--dg-bg, #ffffff)"/>
<text x="31.0" y="295.5" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">build with a comprehension, not += in a loop</text>
<text x="411.0" y="295.5" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" font-style="normal" fill="var(--dg-green, #059669)">20 - 40%</text>
<text x="611.0" y="295.5" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">avoid repeated allocation</text>
<rect x="21.0" y="304" width="900" height="25" rx="0" fill="var(--dg-panel, #f8fafc)"/>
<text x="31.0" y="320.5" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">str.join(parts) instead of s += part</text>
<text x="411.0" y="320.5" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" font-style="normal" fill="var(--dg-green, #059669)">huge for many parts</text>
<text x="611.0" y="320.5" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">strings are immutable</text>
<rect x="21.0" y="329" width="900" height="25" rx="0" fill="var(--dg-bg, #ffffff)"/>
<text x="31.0" y="345.5" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">@lru_cache on a pure, repeated function</text>
<text x="411.0" y="345.5" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" font-style="normal" fill="var(--dg-green, #059669)">100x on hits</text>
<text x="611.0" y="345.5" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">trading memory for time</text>
<rect x="21.0" y="354" width="900" height="25" rx="0" fill="var(--dg-panel, #f8fafc)"/>
<text x="31.0" y="370.5" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">hoist attribute lookup out of a tight loop</text>
<text x="411.0" y="370.5" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" font-style="normal" fill="var(--dg-green, #059669)">5 - 15%</text>
<text x="611.0" y="370.5" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">LOAD_ATTR is slower than LOAD_FAST</text>
<rect x="21.0" y="379" width="900" height="25" rx="0" fill="var(--dg-bg, #ffffff)"/>
<text x="31.0" y="395.5" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">numpy vectorised op instead of a Python loop</text>
<text x="411.0" y="395.5" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" font-style="normal" fill="var(--dg-green, #059669)">50 - 200x</text>
<text x="611.0" y="395.5" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">C loop, no interpreter overhead</text>
<rect x="21.0" y="404" width="900" height="25" rx="0" fill="var(--dg-panel, #f8fafc)"/>
<text x="31.0" y="420.5" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">generators for large/streaming data</text>
<text x="411.0" y="420.5" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" font-style="normal" fill="var(--dg-green, #059669)">massive memory saving</text>
<text x="611.0" y="420.5" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">never materialise what you scan once</text>
<rect x="21.0" y="226" width="900" height="203" rx="6" fill="none" stroke="var(--dg-line, #cbd5e1)" stroke-width="1.4"/>
<line x1="401.0" y1="254" x2="401.0" y2="429" stroke="var(--dg-line, #cbd5e1)" stroke-width="1"/>
<line x1="601.0" y1="254" x2="601.0" y2="429" stroke="var(--dg-line, #cbd5e1)" stroke-width="1"/>
