<text x="495" y="424" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" font-style="italic" fill="var(--dg-muted, #64748b)">Rule:  `=` never copies an object.  It binds a name.  Use copy.copy() / copy.deepcopy() to duplicate.</text>
