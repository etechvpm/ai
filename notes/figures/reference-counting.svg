<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 352" width="990" height="352" role="img" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto"><title>Reference counting and garbage collection</title><style>text { font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif; }svg { color-scheme: light dark; }</style>
