<text x="48.0" y="298" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">Reference counting alone cannot collect CYCLES (a.ref = b; b.ref = a), so CPython also runs a</text>
<text x="48.0" y="316" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">generational cyclic collector - gc.collect().  Weak references (weakref) break cycles on purpose.</text>
