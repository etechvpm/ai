<rect x="45" y="356" width="200" height="62" rx="8" fill="var(--dg-violetbg, #ede9fe)" stroke="var(--dg-violet, #7c3aed)" stroke-width="1.6" filter="url(#dgShadow)"/>
<text x="145.0" y="384.5" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" font-style="normal" fill="var(--dg-ink, #0f172a)">else: block</text>
<text x="145.0" y="401.05" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" font-style="normal" fill="var(--dg-muted, #64748b)">ONLY if no break happened</text>
<path d="M 245,387 L 770,387 L 770,387" stroke="var(--dg-slate, #475569)" stroke-width="1.8" fill="none" marker-end="url(#arslate)" stroke-linecap="round"/>
