<path d="M 405.0,298 L 485,339.0 L 405.0,380 L 325,339.0" stroke="var(--dg-amber, #d97706)" stroke-width="1.8" fill="var(--dg-amberbg, #fef3c7)" stroke-linecap="round"/>
<text x="405.0" y="343.0" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="var(--dg-ink, #0f172a)">break hit?</text>
