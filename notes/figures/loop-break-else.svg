<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 486" width="990" height="486" role="img" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto"><title>for / while ... else</title><style>text { font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif; }svg { color-scheme: light dark; }</style>
