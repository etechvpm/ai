<text x="629.0" y="312" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="400" font-style="italic" fill="var(--dg-muted, #64748b)">separate object</text>
