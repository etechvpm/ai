<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 478" width="990" height="478" role="img" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto"><title>Three concurrency models</title><style>text { font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif; }svg { color-scheme: light dark; }</style>
<text x="495" y="28" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="var(--dg-ink, #0f172a)">threading  vs  multiprocessing  vs  asyncio</text>
<rect x="22.0" y="62" width="306" height="250" rx="10" fill="var(--dg-bg, #ffffff)" stroke="var(--dg-blue, #2563eb)" stroke-width="1.6"/>
<rect x="22.0" y="62" width="306" height="34" rx="10" fill="var(--dg-blue, #2563eb)"/>
<rect x="22.0" y="84" width="306" height="12" rx="0" fill="var(--dg-blue, #2563eb)"/>
<text x="175.0" y="84" text-anchor="middle" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'SF Mono', Menlo, monospace" font-size="13.5" font-weight="700" font-style="normal" fill="var(--dg-bg, #ffffff)">threading</text>
<text x="38.0" y="120" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">* OS threads in ONE process</text>
<text x="38.0" y="139" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">* share memory (need Lock)</text>
<text x="38.0" y="158" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">* concurrent, NOT parallel</text>
<text x="38.0" y="177" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">* cheap: ~8 MB stack each</text>
<text x="38.0" y="196" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">* pre-emptive switching</text>
<rect x="34.0" y="232" width="282" height="66" rx="8" fill="var(--dg-bluebg, #dbeafe)"/>
<text x="175.0" y="254" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="600" font-style="normal" fill="var(--dg-blue, #2563eb)">best for:</text>
<text x="175.0" y="270" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="600" font-style="normal" fill="var(--dg-blue, #2563eb)">I/O bound work, GUIs,</text>
<text x="175.0" y="286" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="600" font-style="normal" fill="var(--dg-blue, #2563eb)">talking to many services</text>
<rect x="342.0" y="62" width="306" height="250" rx="10" fill="var(--dg-bg, #ffffff)" stroke="var(--dg-green, #059669)" stroke-width="1.6"/>
<rect x="342.0" y="62" width="306" height="34" rx="10" fill="var(--dg-green, #059669)"/>
<rect x="342.0" y="84" width="306" height="12" rx="0" fill="var(--dg-green, #059669)"/>
<text x="495.0" y="84" text-anchor="middle" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'SF Mono', Menlo, monospace" font-size="13.5" font-weight="700" font-style="normal" fill="var(--dg-bg, #ffffff)">multiprocessing</text>
<text x="358.0" y="120" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">* separate processes + interpreters</text>
<text x="358.0" y="139" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">* NO shared memory (use Queue/pipe)</text>
<text x="358.0" y="158" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">* true parallelism on N cores</text>
<text x="358.0" y="177" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">* expensive: ~MBs + startup cost</text>
<text x="358.0" y="196" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">* no GIL contention</text>
<rect x="354.0" y="232" width="282" height="66" rx="8" fill="var(--dg-greenbg, #d1fae5)"/>
<text x="495.0" y="254" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="600" font-style="normal" fill="var(--dg-green, #059669)">best for:</text>
<text x="495.0" y="270" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="600" font-style="normal" fill="var(--dg-green, #059669)">CPU bound work: images,</text>
<text x="495.0" y="286" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="600" font-style="normal" fill="var(--dg-green, #059669)">ML features, data crunching</text>
<rect x="662.0" y="62" width="306" height="250" rx="10" fill="var(--dg-bg, #ffffff)" stroke="var(--dg-violet, #7c3aed)" stroke-width="1.6"/>
<rect x="662.0" y="62" width="306" height="34" rx="10" fill="var(--dg-violet, #7c3aed)"/>
<rect x="662.0" y="84" width="306" height="12" rx="0" fill="var(--dg-violet, #7c3aed)"/>
<text x="815.0" y="84" text-anchor="middle" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'SF Mono', Menlo, monospace" font-size="13.5" font-weight="700" font-style="normal" fill="var(--dg-bg, #ffffff)">asyncio</text>
<text x="678.0" y="120" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">* ONE thread, cooperative tasks</text>
<text x="678.0" y="139" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">* switch only at await points</text>
<text x="678.0" y="158" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">* 10k+ concurrent connections</text>
<text x="678.0" y="177" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">* cheapest: ~KBs per task</text>
<text x="678.0" y="196" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">* one blocking call freezes all</text>
<rect x="674.0" y="232" width="282" height="66" rx="8" fill="var(--dg-violetbg, #ede9fe)"/>
<text x="815.0" y="254" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="600" font-style="normal" fill="var(--dg-violet, #7c3aed)">best for:</text>
<text x="815.0" y="270" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="600" font-style="normal" fill="var(--dg-violet, #7c3aed)">high-fanout network servers,</text>
<text x="815.0" y="286" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="600" font-style="normal" fill="var(--dg-violet, #7c3aed)">websockets, scraping at scale</text>
<rect x="22.0" y="330" width="916" height="26" rx="6" fill="var(--dg-slate, #475569)"/>
<rect x="22.0" y="350" width="916" height="6" rx="0" fill="var(--dg-slate, #475569)"/>
<text x="32.0" y="347.0" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" font-style="normal" fill="var(--dg-bg, #ffffff)"></text>
<text x="272.0" y="347.0" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" font-style="normal" fill="var(--dg-bg, #ffffff)">threading</text>
<text x="482.0" y="347.0" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" font-style="normal" fill="var(--dg-bg, #ffffff)">multiprocessing</text>
<text x="712.0" y="347.0" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" font-style="normal" fill="var(--dg-bg, #ffffff)">asyncio</text>
<rect x="22.0" y="356" width="916" height="24" rx="0" fill="var(--dg-panel, #f8fafc)"/>
<text x="32.0" y="372.0" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">parallel on many cores?</text>
<text x="272.0" y="372.0" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" font-style="normal" fill="var(--dg-red, #dc2626)">no (GIL)</text>
<text x="482.0" y="372.0" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" font-style="normal" fill="var(--dg-green, #059669)">yes</text>
<text x="712.0" y="372.0" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" font-style="normal" fill="var(--dg-red, #dc2626)">no</text>
<rect x="22.0" y="380" width="916" height="24" rx="0" fill="var(--dg-bg, #ffffff)"/>
<text x="32.0" y="396.0" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">handles 10k connections?</text>
<text x="272.0" y="396.0" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" font-style="normal" fill="var(--dg-amber, #d97706)">hard (memory)</text>
<text x="482.0" y="396.0" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" font-style="normal" fill="var(--dg-red, #dc2626)">very expensive</text>
<text x="712.0" y="396.0" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" font-style="normal" fill="var(--dg-green, #059669)">yes</text>
<rect x="22.0" y="404" width="916" height="24" rx="0" fill="var(--dg-panel, #f8fafc)"/>
<text x="32.0" y="420.0" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">shares objects freely?</text>
<text x="272.0" y="420.0" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" font-style="normal" fill="var(--dg-green, #059669)">yes</text>
<text x="482.0" y="420.0" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" font-style="normal" fill="var(--dg-red, #dc2626)">no, must pickle</text>
<text x="712.0" y="420.0" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" font-style="normal" fill="var(--dg-green, #059669)">yes</text>
<rect x="22.0" y="428" width="916" height="24" rx="0" fill="var(--dg-bg, #ffffff)"/>
<text x="32.0" y="444.0" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">needs async/await syntax?</text>
<text x="272.0" y="444.0" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" font-style="normal" fill="var(--dg-red, #dc2626)">no</text>
<text x="482.0" y="444.0" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" font-style="normal" fill="var(--dg-red, #dc2626)">no</text>
<text x="712.0" y="444.0" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" font-style="normal" fill="var(--dg-green, #059669)">yes, all the way down</text>
<rect x="22.0" y="330" width="916" height="122" rx="6" fill="none" stroke="var(--dg-line, #cbd5e1)" stroke-width="1.4"/>
<line x1="262.0" y1="356" x2="262.0" y2="452" stroke="var(--dg-line, #cbd5e1)" stroke-width="1"/>
<line x1="472.0" y1="356" x2="472.0" y2="452" stroke="var(--dg-line, #cbd5e1)" stroke-width="1"/>
<line x1="702.0" y1="356" x2="702.0" y2="452" stroke="var(--dg-line, #cbd5e1)" stroke-width="1"/>
</svg>
