<rect x="160" y="152" width="460" height="78" rx="10" fill="var(--dg-bg, #ffffff)" stroke="var(--dg-blue, #2563eb)" stroke-width="1.6"/>
<rect x="160" y="152" width="6" height="78" rx="3" fill="var(--dg-blue, #2563eb)"/>
<text x="182" y="178" text-anchor="start" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'SF Mono', Menlo, monospace" font-size="13" font-weight="700" font-style="normal" fill="var(--dg-blue, #2563eb)">calculate_total(items)</text>
<text x="182" y="204" text-anchor="start" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'SF Mono', Menlo, monospace" font-size="11.5" font-weight="400" font-style="normal" fill="var(--dg-slate, #475569)">items = [...]   subtotal = 240</text>
<text x="630" y="196" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" font-style="italic" fill="var(--dg-muted, #64748b)">frame 1</text>
