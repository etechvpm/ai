<rect x="120" y="62" width="6" height="78" rx="3" fill="var(--dg-slate, #475569)"/>
<text x="142" y="88" text-anchor="start" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'SF Mono', Menlo, monospace" font-size="13" font-weight="700" font-style="normal" fill="var(--dg-slate, #475569)">main / &lt;module&gt;</text>
<text x="142" y="114" text-anchor="start" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'SF Mono', Menlo, monospace" font-size="11.5" font-weight="400" font-style="normal" fill="var(--dg-slate, #475569)">total = None</text>
