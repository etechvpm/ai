<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 372" width="990" height="372" role="img" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto"><title>How pytest runs a test</title><style>text { font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif; }svg { color-scheme: light dark; }</style>
  <defs>
    <marker id="arline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dg-line, #cbd5e1)"/></marker>
  </defs>
<text x="495" y="28" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="var(--dg-ink, #0f172a)">Anatomy of a pytest run</text>
<rect x="43.0" y="70" width="168" height="100" rx="10" fill="var(--dg-bg, #ffffff)" stroke="var(--dg-blue, #2563eb)" stroke-width="1.6"/>
<rect x="43.0" y="70" width="168" height="28" rx="10" fill="var(--dg-blue, #2563eb)"/>
<rect x="43.0" y="88" width="168" height="10" rx="0" fill="var(--dg-blue, #2563eb)"/>
<text x="127.0" y="89" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="var(--dg-bg, #ffffff)">1. collect</text>
<text x="127.0" y="126" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" font-style="normal" fill="var(--dg-slate, #475569)">find test_*.py and</text>
<text x="127.0" y="141" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" font-style="normal" fill="var(--dg-slate, #475569)">test_* functions</text>
<rect x="227.0" y="70" width="168" height="100" rx="10" fill="var(--dg-bg, #ffffff)" stroke="var(--dg-violet, #7c3aed)" stroke-width="1.6"/>
<rect x="227.0" y="70" width="168" height="28" rx="10" fill="var(--dg-violet, #7c3aed)"/>
<rect x="227.0" y="88" width="168" height="10" rx="0" fill="var(--dg-violet, #7c3aed)"/>
<text x="311.0" y="89" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="var(--dg-bg, #ffffff)">2. setup fixtures</text>
<text x="311.0" y="126" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" font-style="normal" fill="var(--dg-slate, #475569)">resolve the dependency</text>
<text x="311.0" y="141" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" font-style="normal" fill="var(--dg-slate, #475569)">graph, run yields&#x27; head</text>
<line x1="211.0" y1="120.0" x2="227.0" y2="120.0" stroke="var(--dg-line, #cbd5e1)" stroke-width="1.6" marker-end="url(#arline)"/>
<rect x="411.0" y="70" width="168" height="100" rx="10" fill="var(--dg-bg, #ffffff)" stroke="var(--dg-green, #059669)" stroke-width="1.6"/>
<rect x="411.0" y="70" width="168" height="28" rx="10" fill="var(--dg-green, #059669)"/>
<rect x="411.0" y="88" width="168" height="10" rx="0" fill="var(--dg-green, #059669)"/>
<text x="495.0" y="89" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="var(--dg-bg, #ffffff)">3. run test</text>
<text x="495.0" y="126" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" font-style="normal" fill="var(--dg-slate, #475569)">call the function,</text>
<text x="495.0" y="141" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" font-style="normal" fill="var(--dg-slate, #475569)">assert statements</text>
<line x1="395.0" y1="120.0" x2="411.0" y2="120.0" stroke="var(--dg-line, #cbd5e1)" stroke-width="1.6" marker-end="url(#arline)"/>
<rect x="595.0" y="70" width="168" height="100" rx="10" fill="var(--dg-bg, #ffffff)" stroke="var(--dg-amber, #d97706)" stroke-width="1.6"/>
<rect x="595.0" y="70" width="168" height="28" rx="10" fill="var(--dg-amber, #d97706)"/>
<rect x="595.0" y="88" width="168" height="10" rx="0" fill="var(--dg-amber, #d97706)"/>
<text x="679.0" y="89" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="var(--dg-bg, #ffffff)">4. teardown</text>
<text x="679.0" y="126" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" font-style="normal" fill="var(--dg-slate, #475569)">run code after yield,</text>
<text x="679.0" y="141" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" font-style="normal" fill="var(--dg-slate, #475569)">close resources</text>
<line x1="579.0" y1="120.0" x2="595.0" y2="120.0" stroke="var(--dg-line, #cbd5e1)" stroke-width="1.6" marker-end="url(#arline)"/>
<rect x="779.0" y="70" width="168" height="100" rx="10" fill="var(--dg-bg, #ffffff)" stroke="var(--dg-cyan, #0891b2)" stroke-width="1.6"/>
<rect x="779.0" y="70" width="168" height="28" rx="10" fill="var(--dg-cyan, #0891b2)"/>
<rect x="779.0" y="88" width="168" height="10" rx="0" fill="var(--dg-cyan, #0891b2)"/>
<text x="863.0" y="89" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="var(--dg-bg, #ffffff)">5. report</text>
<text x="863.0" y="126" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" font-style="normal" fill="var(--dg-slate, #475569)">pass / fail / xfail,</text>
<text x="863.0" y="141" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" font-style="normal" fill="var(--dg-slate, #475569)">coverage, durations</text>
<line x1="763.0" y1="120.0" x2="779.0" y2="120.0" stroke="var(--dg-line, #cbd5e1)" stroke-width="1.6" marker-end="url(#arline)"/>
<rect x="43.0" y="196" width="442" height="152" rx="10" fill="var(--dg-panel2, #eef2f7)" stroke="var(--dg-line, #cbd5e1)" stroke-width="1.6"/>
<text x="59.0" y="218" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="var(--dg-slate, #475569)">Fixtures are dependency injection</text>
<text x="59.0" y="242" text-anchor="start" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'SF Mono', Menlo, monospace" font-size="10.5" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">@pytest.fixture</text>
<text x="59.0" y="259" text-anchor="start" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'SF Mono', Menlo, monospace" font-size="10.5" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">def db(tmp_path):            # fixture using a fixture</text>
<text x="59.0" y="276" text-anchor="start" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'SF Mono', Menlo, monospace" font-size="10.5" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">    conn = sqlite3.connect(tmp_path / &#x27;t.db&#x27;)</text>
<text x="59.0" y="293" text-anchor="start" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'SF Mono', Menlo, monospace" font-size="10.5" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">    yield conn               # value handed to the test</text>
<text x="59.0" y="310" text-anchor="start" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'SF Mono', Menlo, monospace" font-size="10.5" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">    conn.close()             # teardown, always runs</text>
<rect x="501.0" y="196" width="442" height="152" rx="10" fill="var(--dg-greenbg, #d1fae5)" stroke="var(--dg-green, #059669)" stroke-width="1.6"/>
<text x="517.0" y="218" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="var(--dg-green, #059669)">Scopes control how often a fixture runs</text>
<rect x="517.0" y="240" width="64.0" height="19" rx="9.5" fill="var(--dg-green, #059669)"/>
<text x="549.0" y="253.1" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" font-style="normal" fill="var(--dg-bg, #ffffff)">function</text>
<text x="631.0" y="254" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">default - fresh per test</text>
<rect x="517.0" y="264" width="100.0" height="19" rx="9.5" fill="var(--dg-green, #059669)"/>
<text x="567.0" y="277.1" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" font-style="normal" fill="var(--dg-bg, #ffffff)">class / module</text>
<text x="631.0" y="278" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">shared within a group</text>
<rect x="517.0" y="288" width="58.0" height="19" rx="9.5" fill="var(--dg-green, #059669)"/>
<text x="546.0" y="301.1" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" font-style="normal" fill="var(--dg-bg, #ffffff)">session</text>
<text x="631.0" y="302" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">once per pytest run</text>
<rect x="517.0" y="312" width="58.0" height="19" rx="9.5" fill="var(--dg-green, #059669)"/>
<text x="546.0" y="325.1" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" font-style="normal" fill="var(--dg-bg, #ffffff)">package</text>
<text x="631.0" y="326" text-anchor="start" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="var(--dg-ink, #0f172a)">once per package</text>
</svg>
